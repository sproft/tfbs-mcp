program: /sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.num_channels:
    distribution: int_uniform
    min: 32
    max: 128
  model.kernel_size:
    distribution: int_uniform
    min: 10
    max: 42
  model.dilations:
    distribution: categorical
    values:
      - [1, 1, 2, 4, 8]
  model.pool_size:
    distribution: int_uniform
    min: 1
    max: 4
  model.dense_sizes:
    distribution: categorical
    values:
      - [128, 64]

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- /home/profts/.conda/envs/mamba/envs/sams/bin/python
- ${program}
- fit
- --model=BPNet
- --model.input_length=24
- --data.data_path=/sc-projects/sc-proj-cc17-P09_TFBS/data/tensors/core_mean
- --data.scaling_method=standardize
- --trainer=/sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_core_mean_standardize_BPNet
- --trainer.callbacks.init_args.dirpath=/sc-projects/sc-proj-cc17-P09_TFBS/saved_models_tuned/core_mean/standardize
- --trainer.callbacks.init_args.filename=best_BPNet
- ${args}
