program: /sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.num_channels:
    distribution: categorical
    values:
      - [32, 64]
  model.paddings:
    distribution: categorical
    values:
      - [1, 1]
  model.dilations:
    distribution: categorical
    values:
      - [1, 1]
  model.kernel_sizes:
    distribution: categorical
    values:
      - [3, 3]
  model.max_pool:
    distribution: categorical
    values:
      - true
      - false
  model.max_pool_size:
    distribution: int_uniform
    min: 1
    max: 4
  model.max_pool_stride:
    distribution: int_uniform
    min: 1
    max: 4
  model.dense_size:
    distribution: int_uniform
    min: 64
    max: 256
  model.dropout_conv:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.dropout_fc:
    distribution: uniform
    min: 0.0
    max: 1.0

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- /home/profts/.conda/envs/mamba/envs/sams/bin/python
- ${program}
- fit
- --model=CNN
- --model.input_length=24
- --data.data_path=/sc-projects/sc-proj-cc17-P09_TFBS/data/tensors/all_mean
- --data.scaling_method=standardize
- --trainer=/sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_all_mean_standardize_CNN
- --trainer.callbacks.init_args.dirpath=/sc-projects/sc-proj-cc17-P09_TFBS/saved_models_tuned/all_mean/standardize
- --trainer.callbacks.init_args.filename=best_CNN
- ${args}
