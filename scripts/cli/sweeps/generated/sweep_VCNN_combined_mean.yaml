program: scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.conv_channels:
    distribution: categorical
    values:
      - [32, 16]
  model.kernel_size:
    distribution: int_uniform
    min: 1
    max: 6
  model.pool_output_size:
    distribution: int_uniform
    min: 50
    max: 200
  model.dense_size:
    distribution: int_uniform
    min: 64
    max: 256

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- python
- ${program}
- fit
- --model=VCNN
- --model.input_length=24
- --data.data_path=/path/to/tfbs-project/data/tensors/combined_mean
- --data.scaling_method=standardize
- --trainer=scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_combined_mean_standardize_VCNN
- --trainer.callbacks.init_args.dirpath=/path/to/tfbs-project/saved_models_tuned/combined_mean/standardize
- --trainer.callbacks.init_args.filename=best_VCNN
- ${args}
