program: scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.num_channels:
    distribution: int_uniform
    min: 32
    max: 128
  model.kernel_size:
    distribution: int_uniform
    min: 10
    max: 42
  model.dilations:
    distribution: categorical
    values:
      - [1, 1, 2, 4, 8]
  model.pool_output_size:
    distribution: int_uniform
    min: 64
    max: 256
  model.dense_sizes:
    distribution: categorical
    values:
      - [128, 64]

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- python
- ${program}
- fit
- --model=VCNNBpnet
- --model.input_length=24
- --data.data_path=/path/to/tfbs-project/data/tensors/core_mean
- --data.scaling_method=standardize
- --trainer=scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_core_mean_standardize_VCNNBpnet
- --trainer.callbacks.init_args.dirpath=/path/to/tfbs-project/saved_models_tuned/core_mean/standardize
- --trainer.callbacks.init_args.filename=best_VCNNBpnet
- ${args}
