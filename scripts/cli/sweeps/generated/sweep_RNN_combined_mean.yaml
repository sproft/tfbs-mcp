program: scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.conv_out_channels:
    distribution: int_uniform
    min: 50
    max: 200
  model.kernel_size:
    distribution: int_uniform
    min: 2
    max: 10
  model.pool_size:
    distribution: int_uniform
    min: 1
    max: 4
  model.dropout_conv:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.gru_hidden_size:
    distribution: int_uniform
    min: 50
    max: 200
  model.gru_num_layers:
    distribution: int_uniform
    min: 1
    max: 2
  model.bidirectional:
    distribution: categorical
    values:
      - true
      - false
  model.dense_size:
    distribution: int_uniform
    min: 50
    max: 200
  model.dropout_fc:
    distribution: uniform
    min: 0.0
    max: 1.0

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- python
- ${program}
- fit
- --model=RNN
- --model.input_length=24
- --data.data_path=/path/to/tfbs-project/data/tensors/combined_mean
- --data.scaling_method=standardize
- --trainer=scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_combined_mean_standardize_RNN
- --trainer.callbacks.init_args.dirpath=/path/to/tfbs-project/saved_models_tuned/combined_mean/standardize
- --trainer.callbacks.init_args.filename=best_RNN
- ${args}
