program: /sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model.conv_channels:
    distribution: categorical
    values:
      - [32, 64]
  model.kernel_size:
    distribution: int_uniform
    min: 1
    max: 6
  model.pool_size:
    distribution: int_uniform
    min: 1
    max: 4
  model.dense_size:
    distribution: int_uniform
    min: 64
    max: 256

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- /home/profts/.conda/envs/mamba/envs/sams/bin/python
- ${program}
- fit
- --model=SimpleCNN
- --model.input_length=24
- --data.data_path=/sc-projects/sc-proj-cc17-P09_TFBS/data/tensors/combined_mean
- --data.scaling_method=standardize
- --trainer=/sc-projects/sc-proj-cc17-P09_TFBS/scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_combined_mean_standardize_SimpleCNN
- --trainer.callbacks.init_args.dirpath=/sc-projects/sc-proj-cc17-P09_TFBS/saved_models_tuned/combined_mean/standardize
- --trainer.callbacks.init_args.filename=best_SimpleCNN
- ${args}
