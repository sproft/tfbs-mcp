program: scripts/cli/train_cli.py
method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  model:
    value: CNN
  model.num_channels:
    distribution: categorical
    values:
      [[2, 2, 4],[2, 4, 8],[4, 8, 16]]
  model.dilations:
    distribution: categorical
    values:
      [[1, 2, 4],[1, 1, 1],[1, 4, 4]]
  model.kernel_sizes:
    distribution: categorical
    values:
      [[3, 5, 7],[3, 5, 7],[3, 5, 9]]
  model.paddings:
    distribution: categorical
    values:
      [[2, 2, 2],[1, 2, 3],[1, 1, 1],[1, 3, 3]]
  model.dense_size:
    distribution: int_uniform
    max: 256
    min: 64
  model.dropout_conv:
    distribution: uniform
    max: 0.5
    min: 0.125
  model.dropout_fc:
    distribution: uniform
    max: 1
    min: 0.25
  model.learning_rate:
    distribution: uniform
    max: 0.002
    min: 0.0005
  model.max_pool:
    distribution: categorical
    values:
      - true
      - false
  model.max_pool_size:
    distribution: int_uniform
    max: 4
    min: 1
  model.max_pool_stride:
    distribution: int_uniform
    max: 4
    min: 1
  data.batch_size:
    distribution: int_uniform
    max: 64
    min: 8
  data.scaling_method:
    distribution: categorical
    values:
      - normalize
      - standardize
      - none

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 27

command:
- ${env}
- python
- ${program}
- fit
- --model=${model}
- --model.input_length=24
- --data.data_path=/path/to/tfbs-project/data/tensors/${data}
- --data.scaling_method=standardize
- --trainer=scripts/cli/yamls/trainers/default.yaml
- --trainer.logger.init_args.project=P09_${data}_standardize_${model}
- --trainer.callbacks.init_args.dirpath=/path/to/tfbs-project/saved_models_tuned/${data}/standardize
- --trainer.callbacks.init_args.filename=best_${model}
- ${args}
