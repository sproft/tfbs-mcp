# Example model config for SimpleCNN.
# Two-layer CNN baseline.
#
# Use from the scripts/cli/ directory:
#   tfbs-train fit --config config.example.yaml --model yamls/models/SimpleCNN.yaml
# ...or from the repo root:
#   tfbs-train fit --config scripts/cli/config.example.yaml --model scripts/cli/yamls/models/SimpleCNN.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.SimpleCNN
init_args:
  input_length: 24
  input_channels: 4
  conv_channels: [32, 64]
  kernel_size: 3
  pool_size: 2
  dense_size: 128
