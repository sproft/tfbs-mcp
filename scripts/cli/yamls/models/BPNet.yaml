# Example model config for BPNet.
# BPNet-style dilated stack for base-resolution count data.
#
# Use from the scripts/cli/ directory:
#   tfbs-train fit --config config.example.yaml --model yamls/models/BPNet.yaml
# ...or from the repo root:
#   tfbs-train fit --config scripts/cli/config.example.yaml --model scripts/cli/yamls/models/BPNet.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.BPNet
init_args:
  input_length: 24
  input_channels: 4
  num_channels: 64
  kernel_size: 21
  dilations: [1, 1, 2, 4, 8]
  pool_size: 2
  dense_sizes: [128, 64]
