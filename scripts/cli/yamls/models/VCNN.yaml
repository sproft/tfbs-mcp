# Example model config for VCNN.
# CNN with adaptive pooling to a fixed length.
#
# Use from the scripts/cli/ directory:
#   tfbs-train fit --config config.example.yaml --model yamls/models/VCNN.yaml
# ...or from the repo root:
#   tfbs-train fit --config scripts/cli/config.example.yaml --model scripts/cli/yamls/models/VCNN.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.VCNN
init_args:
  input_length: 24
  input_channels: 4
  conv_channels: [32, 16]
  kernel_size: 3
  pool_output_size: 100
  dense_size: 128
