# Example model config for my_cnn.
# Small two-layer CNN used in early experiments.
#
# Use from the installed configs directory (tfbs/configs/):
#   tfbs-train fit --config config.example.yaml --model models/my_cnn.yaml
# ...or from the repo root:
#   tfbs-train fit --config tfbs/configs/config.example.yaml --model tfbs/configs/models/my_cnn.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.my_cnn
init_args:
  input_length: 24
  input_channels: 4
  conv_channels: [16, 32]
  kernel_size: 3
  dense_size: 128
