# Example model config for BPNetReal.
# Reference BPNet implementation.
#
# Use from the installed configs directory (tfbs/configs/):
#   tfbs-train fit --config config.example.yaml --model models/BPNetReal.yaml
# ...or from the repo root:
#   tfbs-train fit --config tfbs/configs/config.example.yaml --model tfbs/configs/models/BPNetReal.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.BPNetReal
init_args:
  input_length: 24
  n_filters: 64
  n_layers: 8
  n_control_tracks: 0
  count_output_bias: true
