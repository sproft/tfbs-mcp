# Example model config for VCNN.
# CNN with adaptive pooling to a fixed length.
#
# Use from the installed configs directory (tfbs/configs/):
#   tfbs-train fit --config config.example.yaml --model models/VCNN.yaml
# ...or from the repo root:
#   tfbs-train fit --config tfbs/configs/config.example.yaml --model tfbs/configs/models/VCNN.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.VCNN
init_args:
  input_length: 24
  input_channels: 4
  conv_channels: [32, 16]
  kernel_size: 3
  pool_output_size: 100
  dense_size: 128
