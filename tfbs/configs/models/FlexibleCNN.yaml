# Example model config for FlexibleCNN.
# CNN with per-layer channel and kernel lists.
#
# Use from the installed configs directory (tfbs/configs/):
#   tfbs-train fit --config config.example.yaml --model models/FlexibleCNN.yaml
# ...or from the repo root:
#   tfbs-train fit --config tfbs/configs/config.example.yaml --model tfbs/configs/models/FlexibleCNN.yaml
#
# Values are the class defaults - tune them for your data.
class_path: tfbs.nn.models.FlexibleCNN
init_args:
  input_length: 24
  input_channels: 4
  num_channels: [32, 64]
  kernel_sizes: [3, 3]
  dense_size: 128
