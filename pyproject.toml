[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tfbs-mcp"
version = "0.1.0"
description = "Python library and Model Context Protocol server for transcription factor binding site analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sebastian Proft", email = "sebastian.proft@bih-charite.de"},
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    # Required by the LightningCLI that backs the tfbs-train console script;
    # base pytorch-lightning does not pull it in.
    "jsonargparse[signatures]>=4.27.7",
]

[project.optional-dependencies]
viz = [
    "captum>=0.7",
    "tangermeme>=0.4",
    "logomaker>=0.8",
    "seaborn>=0.13",
]
genomics = [
    "pyfaidx>=0.7",
    "tangermeme>=0.4",
]
tracking = [
    "wandb>=0.16",
]
mcp = [
    # mcp 2 renamed FastMCP, which the server is built on. Keep in sync with
    # MCP_REQUIREMENT in tfbs/mcp/cli.py.
    "mcp>=1.28,<2",
]
foldx = [
    "pyBigWig>=0.3",
]
# Reverse-complement equivariant layers backing the EquiNet architecture.
equinet = [
    "equirc>=1.0",
]
dev = [
    "pytest>=7.0",
]
all = [
    "tfbs-mcp[viz,genomics,tracking,mcp,dev,foldx,equinet]",
]

[project.scripts]
tfbs-train = "tfbs.cli.train_cli:cli_main"
tfbs-predict = "tfbs.predict:main"
tfbs-mcp = "tfbs.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/sproft/tfbs-mcp"
Repository = "https://github.com/sproft/tfbs-mcp"
Issues = "https://github.com/sproft/tfbs-mcp/issues"

[tool.setuptools.packages.find]
include = ["tfbs*"]

# Ship non-.py package data explicitly. Without this it rides along only via
# setuptools-scm's git file finder, so a build from a non-git export (e.g. a
# release tarball) silently omits it.
[tool.setuptools.package-data]
"tfbs.prediction" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
